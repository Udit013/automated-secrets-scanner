name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run API + scanner unit tests
        run: python -m pytest tests/ -v

  scanner-cli:
    name: Scanner CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run CLI scanner tests
        run: python -m pytest test_scanner.py -v

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build

  self-scan:
    name: Dogfood — scan this repo for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scan own source tree
        # Test fixtures intentionally contain fake secrets, so this job
        # publishes the report rather than failing the build.
        continue-on-error: true
        run: python cli.py -d . -o self-scan.json --format json --stats
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-scan-report
          path: self-scan.json
          if-no-files-found: ignore
